---
apiVersion: v1
kind: Namespace
metadata:
  name: data-gravity-system
---
apiVersion: v1
kind: Service
metadata:
  name: mock-rucio
  namespace: data-gravity-system
  labels:
    app: mock-rucio
spec:
  selector:
    app: mock-rucio
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-rucio
  namespace: data-gravity-system
  labels:
    app: mock-rucio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-rucio
  template:
    metadata:
      labels:
        app: mock-rucio
    spec:
      containers:
      - name: mock-rucio
        image: data-gravity-operator:dev
        imagePullPolicy: Never
        command: ["/mock-rucio"]
        args: ["--addr=:8080"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
