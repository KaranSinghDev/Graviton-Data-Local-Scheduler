---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - hep.hep.cern.local
  resources:
  - physicsjobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hep.hep.cern.local
  resources:
  - physicsjobs/finalizers
  verbs:
  - update
- apiGroups:
  - hep.hep.cern.local
  resources:
  - physicsjobs/status
  verbs:
  - get
  - patch
  - update
